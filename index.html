<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boucherie">

<link rel="manifest" href="manifest.webmanifest">
<title>Boucherie Gestion V0.24</title>
<style>
:root{color-scheme:light;--g1:#173D32;--g2:#245B49;--iv:#F4F1E8;--or:#D5A64A;--tx:#2B2F2D;--mu:#5E665F;--ln:#DDD8C8;--wh:#FFFDF7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--iv);color:var(--tx);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{display:none;width:240px;background:var(--g1);color:#fff;padding:20px 12px;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:19px;padding:0 10px 16px;color:#fff}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--or)}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#D9E4DE;padding:12px 10px;border-radius:8px;text-align:left}
.nav[aria-current=page]{background:var(--g2);color:#fff;box-shadow:inset 3px 0 0 var(--or)}
.main{flex:1;min-width:0;padding-bottom:84px}
.top{background:var(--g1);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:18px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:#fff;padding:8px 12px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--or);color:var(--g1);font-weight:600}
.wrap{padding:16px;max-width:1100px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;border:1px solid var(--ln);background:var(--wh);border-radius:20px;padding:8px 14px;min-height:40px;color:var(--tx)}
.chips button[aria-pressed=true]{background:var(--g2);border-color:var(--g2);color:#fff}
.hero{margin:16px 0;background:var(--g1);color:#fff;border-radius:12px;padding:18px;border-bottom:4px solid var(--or)}
.hero .l{font-size:14px;color:#D9E4DE}
.hero .v{font-size:34px;font-weight:700;margin-top:2px}
.hero .s{font-size:13px;color:#BFD0C7;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--wh);border:1px solid var(--ln);border-radius:10px;padding:12px}
.k .l{font-size:13px;color:var(--mu)}
.k .v{font-size:20px;font-weight:700;color:var(--g1);margin-top:2px;overflow-wrap:anywhere}
.k.debt .v{color:#8A5A12}
.h2{font-size:15px;font-weight:700;margin:22px 0 8px;color:var(--g1)}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{background:var(--wh);border:1px solid var(--ln);border-radius:10px;padding:14px;text-align:left;color:var(--tx);min-height:64px}
.mod b{display:block;color:var(--g1)}
.mod span{font-size:12px;color:var(--mu)}
.panel{background:var(--wh);border:1px solid var(--ln);border-left:4px solid var(--or);border-radius:10px;padding:16px;margin-top:16px}
.panel h2{margin:0 0 6px;font-size:18px;color:var(--g1)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--g1);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .nav{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;text-align:center;justify-content:center;min-height:52px}
.tabs .nav[aria-current=page]{box-shadow:inset 0 3px 0 var(--or);background:var(--g2)}
.ic{font-size:18px;line-height:1}
.note{font-size:12px;color:var(--mu);margin-top:20px}
@media(min-width:900px){.side{display:flex}.tabs{display:none}.main{padding-bottom:24px}.grid{grid-template-columns:repeat(4,1fr)}.mods{grid-template-columns:repeat(3,1fr)}}
.ach{display:block;width:100%;text-align:left;background:var(--wh);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--tx)}
.ach .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ach .m{font-size:13px;color:var(--mu);margin:2px 0 6px}
.ach .r2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.ach .rs{font-weight:700;color:#8A5A12}
.bd{font-size:12px;font-weight:600;border-radius:12px;padding:3px 10px;white-space:nowrap}
.bd.solde{background:#DCE9E2;color:var(--g1)}.bd.partiel{background:#F3E4C0;color:#6B4A0B}.bd.impaye{border:1px solid #8A5A12;color:#8A5A12}
.fl{display:block;margin-bottom:12px}.fl>span{display:block;font-size:14px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;min-height:46px;font:inherit;color:var(--tx);background:#fff;border:1px solid #B9B39F;border-radius:8px;padding:8px 10px}
input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:1px}
.bt{min-height:48px;border-radius:8px;border:0;background:var(--g1);color:#fff;padding:10px 18px;font-weight:600;margin:4px 8px 4px 0}
.bt.g{background:none;color:var(--g1);border:1px solid var(--g1)}.bt.w{background:var(--or);color:var(--g1)}
.lnk{background:none;border:0;color:var(--g2);padding:8px 0;min-height:44px;font-weight:600}
.h2b{margin:4px 0 12px;font-size:20px;color:var(--g1)}
.frr{display:grid;grid-template-columns:1fr 120px 44px;gap:6px;margin-bottom:8px}
.frr button{border:1px solid #B9B39F;background:#fff;border-radius:8px}
.err{border-left-color:#8A5A12;background:#FBF3E0}.err p{margin:2px 0}
.tot{background:var(--wh);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--ln)}td.n{text-align:right;white-space:nowrap}
.cx{text-decoration:line-through;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(23,61,50,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dlg{background:var(--wh);border-radius:12px;padding:20px;max-width:380px;width:100%;border-top:4px solid var(--or)}
.fil{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.fil .full{grid-column:1/-1}
.rg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.rg button{flex:1;min-width:110px;min-height:46px;border:1px solid var(--g2);background:#fff;color:var(--g1);border-radius:8px}.rg button[aria-pressed=true]{background:var(--g2);color:#fff}
.bigc{background:var(--g1);color:#fff;border-radius:12px;padding:18px;border-bottom:4px solid var(--or);margin:12px 0;text-align:center}
.bigc .l{font-size:16px;color:#D9E4DE}.bigc .v{font-size:48px;font-weight:700;line-height:1.1;margin:4px 0}.bigc .s{font-size:15px;color:var(--or)}
.ok{color:var(--g2);font-weight:700}.ko{color:#8A5A12;font-weight:700}
.setup .side,.setup .tabs{display:none!important}
@media print{.side,.tabs,.top,.bt,.lnk,.chips{display:none!important}.main{padding:0}}
#pad{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--wh);border-top:3px solid var(--or);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.2)}
#pad.on{display:block}
#pad .pd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 6px 6px}
#pad .pl{font-size:13px;color:var(--mu)}
#pad .pv{font-size:30px;font-weight:700;color:var(--g1);text-align:right;min-height:38px;word-break:break-all}
#pad .pq{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
#pad .pq button{flex:1;min-width:64px;min-height:44px;border:1px solid var(--g2);background:#fff;color:var(--g1);border-radius:8px;font-weight:600;font-size:15px}
#pad .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#pad .pg button{min-height:56px;font-size:24px;border:0;border-radius:10px;background:var(--iv);color:var(--tx);font-weight:600}
#pad .pg button.ok{background:var(--g1);color:#fff}
#pad .pg button.bk{background:#F3E4C0}
#pad .pg button:disabled{opacity:.35}
body.padopen .main{padding-bottom:400px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <h1 id="title"></h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="seg" role="group" aria-label="Profil" id="prof"></div>
        <div class="seg" role="group" aria-label="Langue" id="lang"></div>
      </div>
    </header>
    <div class="wrap" id="view"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<script>
// Données : tout à zéro pour l'instant. Les modules des étapes 3 à 7 rempliront ces valeurs.
var D={encaisse:0,ca:0,stock:0,boeufs:0,abattages:0,clients:0,revendeurs:0,creances:0,dettes:0,depenses:0,pertes:0,resultat:0};
var T={
fr:{app:"Boucherie Gestion",ab:"Abatteur",rv:"Revendeur",day:"Jour",week:"Semaine",month:"Mois",custom:"Période",
home:"Accueil",achats:"Achats de bœufs",abat:"Abattages et stock",dist:"Distributions",fin:"Finances",more:"Plus",
recu:"Réceptions",ventes:"Ventes",cli:"Clients",dep:"Dépenses",emp:"Employés",pertes:"Pertes",rap:"Rapports",sync:"Synchronisation",
encaisse:"Recettes encaissées",encs:"Argent réellement reçu",ca:"Chiffre d'affaires",stock:"Stock disponible",boeufs:"Bœufs achetés",abattages:"Abattages",clients:"Clients",revendeurs:"Revendeurs",
creances:"Dettes à recevoir",dettes:"Dettes à payer",depenses:"Dépenses",perte:"Pertes",resultat:"Résultat (bénéfice ou perte)",
soon:"Ce module sera construit à l'étape",empty:"Aucune donnée pour le moment. Les chiffres apparaîtront dès les premiers enregistrements.",key:"Indicateurs",mods:"Modules",
note:"Version 0.24 : corrections et vérification complète. Pavé de chiffres, valeurs habituelles, alertes contre les erreurs de chiffres. Installable sur iPhone (écran d'accueil) et utilisable sans Internet une fois installée. Prête pour l'application Android (envoi et réception automatiques des SMS). Synchroniser par numéro de téléphone (SMS). Rentabilité. Historique de toutes les opérations. Sauvegarde et restauration, export en tableaux. Dépenses, employés et pertes. Rapports par produit, facture de livraison. Stock général de viande, abats regroupés. Synchronisation encore manuelle."},
bm:{app:"Boucherie Gestion",ab:"Sogo faga",rv:"Sogo feerekɛla",day:"Don",week:"Dɔgɔkun",month:"Kalo",custom:"Waati sugandi",
home:"So",achats:"Misi sanni",abat:"Faga ni stɔki",dist:"Sogo tilali",fin:"Wari",more:"Wɛrɛw",
recu:"Sogo ta",ventes:"Feere",cli:"Sanbagaw",dep:"Wari bɔli",emp:"Baarakɛlaw",pertes:"Tiɲɛni",rap:"Rapɔrɔ",sync:"Sinkɔrɔni",
encaisse:"Wari sɔrɔ",encs:"Wari min sɔrɔla tigi la",ca:"Feere bɛɛ ka wari",stock:"Stɔki",boeufs:"Misi sannen",abattages:"Fagali",clients:"Sanbagaw",revendeurs:"Feerekɛlaw",
creances:"Juru min b'an na",dettes:"Juru min b'an kan",depenses:"Wari bɔli",perte:"Tiɲɛni",resultat:"Sɔrɔ ni bɔ",
soon:"Nin fɛn bɛna dilan ɲɛfɔli",empty:"Foyi tɛ yen folo. Jate bɛna bɔ ni i y'a ɲɛnabɔ.",key:"Jate",mods:"Baaraw",
note:"Sɛbɛn 0.11: Sogo kɔnɔfɛn caman sɛgɛsɛgɛ ni don kɔnɔ jate."}};
var S={p:"ab",l:"fr",per:"day",pg:"home",step:null};
try{var s=JSON.parse(localStorage.getItem("bg01")||"{}");if(s.p)S.p=s.p;if(s.l)S.l=s.l}catch(e){}
var NAV={
ab:[["home","🏠","home"],["achats","🐂","achats"],["abat","⚖️","abat"],["dist","🤝","dist"],["fin","💰","fin"],["more","⋯","more"]],
rv:[["home","🏠","home"],["recu","📦","recu"],["ventes","🧾","ventes"],["cli","👥","cli"],["dep","💸","dep"],["more","⋯","more"]]};
var STEP={};
var MORE={ab:["calc","ventes","cli","emp","dep","pertes","rap","histo","backup","sync"],rv:["calc","fin","pertes","rap","histo","backup","sync"]};
function t(k){return T[S.l][k]||T.fr[k]||k}
function f(n){return new Intl.NumberFormat("fr-FR").format(n)+" FCFA"}
function save(){try{localStorage.setItem("bg01",JSON.stringify({p:S.p,l:S.l}))}catch(e){}}
function nav(cls){return NAV[S.p].map(function(n){return '<button class="nav" data-pg="'+n[0]+'"'+(S.pg===n[0]?' aria-current="page"':'')+'><span class="ic">'+n[1]+'</span><span>'+t(n[2])+'</span></button>'}).join("")}
function seg(id,arr,cur,key){document.getElementById(id).innerHTML=arr.map(function(a){return '<button data-'+key+'="'+a[0]+'" aria-pressed="'+(cur===a[0])+'">'+a[1]+'</button>'}).join("")}
function kpi(l,v,c){return '<div class="k '+(c||'')+'"><div class="l">'+t(l)+'</div><div class="v">'+v+'</div></div>'}
function home(){
  var h='<div class="chips" role="group">'+[["day","day"],["week","week"],["month","month"],["custom","custom"]].map(function(a){return '<button data-per="'+a[0]+'" aria-pressed="'+(S.per===a[0])+'">'+t(a[1])+'</button>'}).join("")+'</div>';
  h+=bkBanner();h+='<div class="hero"><div class="l">'+t("encaisse")+'</div><div class="v">'+f(D.encaisse)+'</div><div class="s">'+t("encs")+'</div></div>';
  h+='<div class="h2">'+t("key")+'</div><div class="grid">';
  h+=kpi("ca",f(D.ca))+kpi("stock",fkg(Math.round(D.stock*1000)))+kpi("creances",f(D.creances),"debt")+kpi("dettes",f(D.dettes),"debt");
  if(S.p==="ab"){h+=kpi("boeufs",D.boeufs)+kpi("abattages",D.abattages)+kpi("revendeurs",D.revendeurs)}else{h+=kpi("clients",D.clients)}
  h+=kpi("depenses",f(D.depenses))+kpi("perte",fkg(Math.round(D.pertes*1000)))+kpi("resultat",f(D.resultat))+'</div>';
  if(!DB.achats.length)h+='<div class="panel"><div>'+t("empty")+'</div></div>';
  h+='<div class="h2">'+t("mods")+'</div><div class="mods">'+MORE[S.p].concat(NAV[S.p].slice(1,5).map(function(n){return n[0]})).map(function(m){var lab=t(m);return '<button class="mod" data-pg="'+m+'"><b>'+lab+'</b><span>'+(STEP[m]?'Étape '+STEP[m]:'Prêt à tester')+'</span></button>'}).join("")+'</div>';
  h+='<p class="note">'+t("note")+'</p>';return h}
function page(){if(S.pg==="sync")return syncPage();if(S.pg==="fin")return finPage();if(S.pg==="histo")return histoPage();if(S.pg==="backup")return backupPage();if(S.pg==="dep")return depenses();if(S.pg==="emp"&&S.p==="ab")return employes();if(S.pg==="pertes")return pertes();if(S.pg==="rap")return rapport();if(S.pg==="ventes")return ventes();if(S.pg==="cli")return clients();if(S.pg==="dist")return dist();if(S.pg==="recu")return recu();if(!ROLE)return setupPage();if(S.pg==="role")return rolePage();if(S.p==="rv"&&["achats","abat","dist","emp"].indexOf(S.pg)>-1)S.pg="home";if(S.pg==="abat")return abat();if(S.pg==="calc")return calcPage();if(S.pg==="achats")return achats();
  if(S.pg==="home")return home();
  if(S.pg==="more")return '<div class="h2">'+t("more")+'</div><div class="mods">'+MORE[S.p].map(function(m){return '<button class="mod" data-pg="'+m+'"><b>'+t(m)+'</b><span>'+(STEP[m]?'Étape '+STEP[m]:'Prêt à tester')+'</span></button>'}).join("")+'</div>';
  return '<div class="panel"><h2>'+t(S.pg)+'</h2><div>'+t("soon")+' '+STEP[S.pg]+'.</div></div>'}
function render(){calc();
  document.documentElement.lang=S.l==="fr"?"fr":"bm";
  document.getElementById("title").textContent=t("app");
  document.body.className=ROLE?"":"setup";document.getElementById("prof").innerHTML=ROLE?'<button data-act="r_menu">🔒 '+(S.p==="ab"?t("ab"):t("rv"))+'</button>':"";
  seg("lang",[["fr","FR"],["bm","BM"]],S.l,"l");
  document.getElementById("side").innerHTML='<div class="brand">'+t("app")+'<small>V0.24</small></div>'+nav()+MORE[S.p].map(function(m){return '<button class="nav" data-pg="'+m+'"'+(S.pg===m?' aria-current="page"':'')+'><span class="ic">▫️</span><span>'+t(m)+'</span></button>'}).join("");
  document.getElementById("tabs").innerHTML=nav();
  usualPrep();document.getElementById("view").innerHTML=page();updTotal();calcOut();dprev();vprev();postRender();save()}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;if(d.act){act(d.act,d);return}
  if(d.p){S.p=d.p;S.pg="home"}else if(d.l){S.l=d.l}else if(d.per){S.per=d.per}else if(d.pg){S.pg=d.pg;S.sub="list";if(S.d)S.d.v="list";if(S.vs)S.vs.v="list";if(S.cs)S.cs.v="list";if(S.es)S.es.v="list";if(S.ps)S.ps.v="list";if(S.ds)S.ds.v="list";S.as="list";S.sform=false}else return;render()});

/* ===== MODULE ACHATS DE BOEUFS (V0.2) =====
Modèle prêt pour SQLite : tables achats, paiements, histo (1 ligne = 1 enregistrement, id unique, jamais d'effacement réel). Montants = entiers FCFA. */
var DB={achats:[],paiements:[],histo:[],abattages:[],mouv:[],revendeurs:[],livraisons:[],reglements:[],recus:[],ventes:[],clients:[],encaiss:[],cfg:{},depenses:[],employes:[],jours:[],pertesrv:[]},saveErr=false;
var ROLE=null;
try{ROLE=localStorage.getItem("bg_role");if(ROLE!=="ab"&&ROLE!=="rv")ROLE=null;if(ROLE)S.p=ROLE;if(!localStorage.getItem("bg_db_ab")&&localStorage.getItem("bg_db"))localStorage.setItem("bg_db_ab",localStorage.getItem("bg_db"))}catch(e){}
function dbKey(){return "bg_db_"+S.p}
function loadDB(){DB.achats=[];DB.paiements=[];DB.histo=[];DB.abattages=[];DB.mouv=[];DB.revendeurs=[];DB.livraisons=[];DB.reglements=[];DB.recus=[];DB.ventes=[];DB.clients=[];DB.encaiss=[];DB.cfg={};DB.depenses=[];DB.employes=[];DB.jours=[];DB.pertesrv=[];try{var raw=localStorage.getItem(dbKey());if(raw){var o=JSON.parse(raw);DB.achats=o.achats||[];DB.paiements=o.paiements||[];DB.histo=o.histo||[];DB.abattages=o.abattages||[];DB.mouv=o.mouv||[];DB.revendeurs=o.revendeurs||[];DB.livraisons=o.livraisons||[];DB.reglements=o.reglements||[];DB.recus=o.recus||[];DB.ventes=o.ventes||[];DB.clients=o.clients||[];DB.encaiss=o.encaiss||[];DB.cfg=o.cfg||{};DB.depenses=o.depenses||[];DB.employes=o.employes||[];DB.jours=o.jours||[];DB.pertesrv=o.pertesrv||[]}}catch(e){saveErr=true}}
loadDB();
S.sub="list";S.draft=null;S.sel=null;S.err=[];S.warn=false;S.cf=null;S.pay=null;S.fl={q:"",from:"",to:"",st:""};
function persist(){try{stampAnnul();localStorage.setItem(dbKey(),JSON.stringify(DB));saveErr=false}catch(e){saveErr=true}}
function uid(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():"id"+Date.now()+Math.random().toString(16).slice(2)}
function fmtd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return fmtd(new Date())}
function fd(s){return s?s.split("-").reverse().join("/"):""}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim()}
function num(s){s=String(s==null?"":s).replace(/[\s\u00a0\u202f]/g,"").replace(/(fcfa|cfa|f)$/i,"");if(/^\d{1,3}([.,]\d{3})+$/.test(s))s=s.replace(/[.,]/g,"");return /^\d+$/.test(s)?parseInt(s,10):NaN}
function live(){return DB.achats.filter(function(a){return !a.supprime})}
function find(id){return DB.achats.filter(function(a){return a.id===id})[0]}

Chaque contact est identifié par son numéro. « Envoyer par SMS » ouvre l'application SMS avec le numéro et le message déjà remplis (le code est dedans). Le contact copie le SMS reçu et touche « Coller et importer ». L'application retient ce qui a déjà été envoyé et n'envoie que les changements. Ce n'est PAS encore une liaison automatique entre les deux téléphones. */

function telOkFmt(s){return /^\+?\d{6,15}$/.test(cleanTel(s))}
function telKey(s){return String(s||"").replace(/\D/g,"").slice(-8)}

 if(S.pg==="dist"&&S.d&&S.d.v==="form"&&S.dd){var x=S.dd,key=(x.rv||"")+"|"+(x.prod||"");if(x.rv&&x.prod&&x.uf!==key){x.uf=key;x.hint="";x.hintVal=null;var u=x.pmode==="fixe"?null:lastNombreLiv(x.rv,x.prod);if(u){x.hintVal=u.nombre;var nm=(rvf(x.rv)||{}).nom||"ce revendeur";if(x.pin==="n"&&(!String(x.nombre||"").trim()||x.nombre===x.autoVal)){x.nombre=String(u.nombre);x.autoVal=x.nombre;x.hint="Nombre habituel pour "+nm+" : "+u.nombre+" (dernière fois le "+fd(u.date)+"). Déjà rempli : changez-le si besoin."}else x.hint="Nombre habituel pour "+nm+" : "+u.nombre+" (dernière fois le "+fd(u.date)+")."}}}
 if(S.pg==="ventes"&&S.vs&&S.vs.v==="form"&&S.vf){var y=S.vf,k2=(y.client||"")+"|"+(y.prod||"");if(y.prod&&y.mode==="kg"&&y.uf!==k2){y.uf=k2;y.hint="";y.hintVal=null;var w=lastNombreVente(y.prod,y.client);if(w){y.hintVal=w.nombre;var cn=w.client_id&&cfi(w.client_id)?" ("+cfi(w.client_id).nom+")":"";if(!String(y.nombre||"").trim()||y.nombre===y.autoVal){y.nombre=String(w.nombre);y.autoVal=y.nombre;y.hint="Nombre de la dernière vente de ce produit : "+w.nombre+cn+". Déjà rempli : changez-le si besoin."}else y.hint="Nombre de la dernière vente de ce produit : "+w.nombre+cn+"."}}}}

 if(S.pg==="ventes"&&S.vs&&S.vs.v==="form"&&S.vf&&S.vf.hint){var e2=document.getElementById("vprev");if(e2)e2.insertAdjacentHTML("beforebegin",'<div class="panel" style="margin:6px 0"><small>'+esc(S.vf.hint)+'</small></div>')}}

 S.dd={rv:rvid,date:today(),ref:(a&&!a.supprime)?L.ref:"",prod:L.produit,nom:L.nom||"",qte:pn(L.produit)[2]==="k"?String(L.g/1000).replace(".",","):String(L.g),nombre:fx?"":String(L.nombre),prixkg:"",total:fx?String(L.reel):"",pmode:fx?"fixe":"kg",pin:"n",paye:"",unit:"b",uf:rvid+"|"+L.produit,hintVal:fx?null:L.nombre,autoVal:fx?undefined:String(L.nombre),hint:"Copié de la dernière distribution du "+fd(L.date)+". Changez ce qui est différent (poids, bœuf, date), puis enregistrez."};

 if(k.money){[1000,5000,10000].forEach(function(n){h+='<button data-k="add:'+n+'">+'+padFmt(String(n))+'</button>'});var tt=padTout(i);if(tt>0)h+='<button data-k="set:'+String(tt).replace(".",",")+'">Tout '+padFmt(String(tt).replace(".",","))+'</button>'}
 if(k.nombre){var hv=d.dd==="nombre"?(S.dd&&S.dd.hintVal):(d.vf==="nombre"?(S.vf&&S.vf.hintVal):null);if(hv>0)h+='<button data-k="set:'+hv+'">Habituel '+padFmt(String(hv))+'</button>'}

 var dec=i.getAttribute("data-pad")==="decimal";Array.prototype.forEach.call(e.querySelectorAll('button[data-k=","]'),function(b){b.disabled=!dec});
 e.classList.add("on");document.body.classList.add("padopen");padRefresh();setTimeout(function(){try{i.scrollIntoView({block:"center"})}catch(x){}},80)}
function padClose(){clearTimeout(PAD.t);var e=document.getElementById("pad");if(e)e.classList.remove("on");document.body.classList.remove("padopen");PAD.inp=null}
function padSet(v){var i=PAD.inp;if(!i)return;i.value=v;i.dispatchEvent(new Event("input",{bubbles:true}));padRefresh()}
function padClick(ev){var b=ev.target.closest("button");if(!b||b.disabled)return;var k=b.dataset.k,i=PAD.inp;if(!k)return;if(k==="ok"){padClose();return}if(!i)return;var v=i.value||"";
 if(k==="bk")v=v.slice(0,-1);else if(k==="clr")v="";else if(k===","){if(i.getAttribute("data-pad")==="decimal"&&!/[,.]/.test(v))v=(v===""?"0":v)+","}
 else if(k.indexOf("add:")===0){var cur=parseFloat(v.replace(",","."))||0;v=String(Math.round((cur+parseFloat(k.slice(4)))*1000)/1000).replace(".",",")}
 else if(k.indexOf("set:")===0)v=k.slice(4);
 else if(/^\d+$/.test(k)){if(v.replace(/\D/g,"").length<12)v=v+k}

 if(PAD.inp&&!document.body.contains(PAD.inp))padClose();else if(PAD.inp)padRefresh()}
